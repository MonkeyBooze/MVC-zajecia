{% load static %}
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block tytul %}Wydatki domowe{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background: #f4f4f4;
            color: #333;
        }
        header {
            background: #2c3e50;
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        header h1 {
            margin: 0;
            display: inline-block;
        }
        header nav {
            float: right;
            margin-top: 8px;
        }
        header nav a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
        }
        header nav a:hover {
            text-decoration: underline;
        }
        main {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background: #ecf0f1;
        }
        tr:hover {
            background: #f9f9f9;
        }
        .przyciski a, .przyciski button {
            display: inline-block;
            padding: 5px 10px;
            margin-right: 5px;
            background: #3498db;
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
        }
        .przyciski a.usun, .przyciski button.usun {
            background: #e74c3c;
        }
        .przyciski a:hover, .przyciski button:hover {
            opacity: 0.85;
        }
        .przycisk-dodaj {
            display: inline-block;
            padding: 10px 20px;
            background: #27ae60;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        .przycisk-dodaj:hover {
            background: #229954;
        }
        form p {
            margin-bottom: 10px;
        }
        form label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        form input, form select, form textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .submit {
            padding: 10px 20px;
            background: #2980b9;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
        }
        .submit:hover {
            background: #21618c;
        }
        .podsumowanie {
            background: #ecf0f1;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .podsumowanie h3 {
            margin-top: 0;
        }
        .suma-glowna {
            font-size: 1.5em;
            font-weight: bold;
            color: #c0392b;
        }
        footer {
            text-align: center;
            margin-top: 20px;
            color: #777;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <header>
        <h1>Wydatki domowe</h1>
        <nav>
            <a href="{% url 'lista_wydatkow' %}">Lista</a>
            <a href="{% url 'dodaj_wydatek' %}">Dodaj wydatek</a>
        </nav>
    </header>

    <main>
        {% block tresc %}{% endblock %}
    </main>

    <footer>
        System monitorowania wydatków domowych
    </footer>
</body>
</html>
